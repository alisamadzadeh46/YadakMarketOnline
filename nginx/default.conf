# YadakMart edge: nginx reverse proxy + load balancer.
# API/admin/media go to Django; everything else goes to Next.js.
# Scale the API horizontally with:  docker compose up -d --scale web=3
# (least_conn spreads requests over all healthy web replicas)

upstream django_backend {
    least_conn;
    server web:8000;
}

upstream next_frontend {
    server frontend:3000;
}

# Basic per-IP rate limit as a first line of defense.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # --- Django: API, admin, uploaded media, collected static ---
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Private uploads (KYC, receipts) are only reachable through Django's
    # signed-token view; never straight off the media path.
    location ^~ /media/private/ {
        return 404;
    }

    location /media/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /static/ {
        proxy_pass http://django_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Mirrors production (minus HSTS, meaningless over plain HTTP) so a policy
    # change is caught here rather than on the live site. One deliberate
    # difference: 'unsafe-eval' stays in DEV because React's development build
    # uses eval() for its debugging features — it never does in production,
    # which is exactly why prod can drop it.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:8020 https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://trustseal.enamad.ir https://bitpay.ir; font-src 'self' data:; connect-src 'self' http://localhost:8020; media-src 'self' blob:; form-action 'self'" always;

    # --- Next.js: everything else (websocket upgrade kept for dev HMR) ---
    location / {
        proxy_pass http://next_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
