name: Repository guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the guard test suite
        run: python -m unittest discover -s tools -t .

      - name: Scan every tracked file
        run: python -m tools.repo_guard all

      - name: Scan the commits of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m tools.repo_guard range "origin/${BASE_REF}..HEAD"
